<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean Data Architecture · Supports</title>
<style>
  :root { --ink: #17181c; --soft: #4b4f5a; --muted: #8a8f9c; --line: #e8e9ee; --violet: #7C4DEB; --turquoise: #82F6EB; --citron: #EEFA5C; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: #fff; line-height: 1.6; }
  main { max-width: 52rem; margin: 0 auto; padding: 4rem max(16px, 6vw); }
  .brand { display: flex; align-items: center; gap: .7rem; font-weight: 600; }
  .brand i { width: 1.8rem; height: 1.8rem; border-radius: .45rem; background: linear-gradient(135deg, var(--turquoise), var(--citron)); }
  h1 { margin-top: 2.5rem; font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 600; line-height: 1.15; }
  h1::after { content: ""; display: block; width: 3rem; height: .3rem; margin-top: 1rem; border-radius: .2rem; background: linear-gradient(90deg, var(--turquoise), var(--violet)); }
  ul { list-style: none; margin-top: 2rem; }
  li { border-top: 1px solid var(--line); }
  li a { display: block; padding: 1.1rem 0; color: inherit; text-decoration: none; }
  li a:hover b, li a:focus-visible b { color: var(--violet); }
  li b { display: block; font-weight: 600; font-size: 1.1rem; }
  li span { font-size: .85rem; color: var(--muted); }
  footer { margin-top: 3rem; font-size: .85rem; color: var(--muted); }
  footer a { color: var(--soft); }
</style>
</head>
<body>
<main>
  <p class="brand"><i></i>Clean Data Architecture</p>
  <h1>Supports de cours et de conférences</h1>
  <ul>
    <li><a href="ifp-donnee-indicateur/"><b>De la donnée à l'indicateur : gérer la transversalité</b><span>IFP School · Mastère Spécialisé · 2026</span></a></li>
  </ul>
  <footer>Gaëlle Seret · <a href="https://cleandataarchitecture.substack.com/">cleandataarchitecture.substack.com</a></footer>
</main>
</body>
</html>
