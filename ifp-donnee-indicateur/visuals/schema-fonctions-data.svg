</text><text x="1465" y="264" font-size="14" text-anchor="middle" fill="#4b4f5a">équipes data</text><rect x="1385" y="400" width="160" height="260" rx="16" fill="#fff" stroke="#7C4DEB" stroke-width="2" stroke-dasharray="7 6"/><text x="1465" y="450" font-size="18" font-weight="600" text-anchor="middle" fill="#17181c">Data</text><text x="1465" y="474" font-size="18" font-weight="600" text-anchor="middle" fill="#17181c">architect</text><text x="1465" y="520" font-size="14" text-anchor="middle" fill="#4b4f5a">dessine comment</text><text x="1465" y="542" font-size="14" text-anchor="middle" fill="#4b4f5a">systèmes et données</text><text x="1465" y="564" font-size="14" text-anchor="middle" fill="#4b4f5a">s’assemblent</text><text x="1465" y="690" font-size="13" text-anchor="middle" fill="#8a8f9c">sur toute la chaîne</text><path d="M930 455 H870 V655 H624" fill="none" stroke="#17181c" stroke-width="2.5" marker-end="url(#ar)"/><rect x="652" y="620" width="200" height="26" fill="#fff"/><text x="752" y="638" font-size="14" text-anchor="middle" fill="#17181c">indicateurs</text></svg>