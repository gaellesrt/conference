<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="640" viewBox="0 0 1560 640" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Carte des applications : le portail fournisseurs envoie les composants au PLM ; le PLM envoie les caractéristiques produit, dont l'impact CO2, au PIM et la nomenclature à l'ERP ; le PIM envoie prix et fiches à la caisse ; la caisse envoie les ventes à l'ERP et les achats clients au CRM ; toutes les applications sont copiées chaque nuit dans le datalake."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17181c"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C4DEB"/></marker></defs><rect width="1560" height="640" fill="#fff"/><rect x="40" y="70" width="210" height="96" rx="14" fill="#FDF7CF" stroke="#E3D36A" stroke-width="2"/><text x="145.0" y="114.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">Portail fournisseurs</text><text x="145.0" y="138.0" font-size="14" text-anchor="middle" fill="#4b4f5a">MDM</text><rect x="365" y="70" width="210" height="96" rx="14" fill="#F1EAFD" stroke="#7C4DEB" stroke-width="3"/><text x="470.0" y="114.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">PLM</text><text x="470.0" y="138.0" font-size="14" text-anchor="middle" fill="#4b4f5a">conception produit</text><rect x="690" y="70" width="210" height="96" rx="14" fill="#FDF7CF" stroke="#E3D36A" stroke-width="2"/><text x="795.0" y="114.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">PIM</text><text x="795.0" y="138.0" font-size="14" text-anchor="middle" fill="#4b4f5a">fiches produits</text><rect x="1015" y="70" width="210" height="96" rx="14" fill="#FDF7CF" stroke="#E3D36A" stroke-width="2"/><text x="1120.0" y="114.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">Caisse</text><text x="1120.0" y="138.0" font-size="14" text-anchor="middle" fill="#4b4f5a">point de vente</text><rect x="1340" y="70" width="210" height="96" rx="14" fill="#FDF7CF" stroke="#E3D36A" stroke-width="2"/><text x="1445.0" y="114.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">CRM</text><text x="1445.0" y="138.0" font-size="14" text-anchor="middle" fill="#4b4f5a">relation client</text><line x1="254" y1="118.0" x2="359" y2="118.0" stroke="#17181c" stroke-width="2.4" marker-end="url(#ar)"/><text x="306.5" y="106.0" font-size="14" text-anchor="middle" fill="#4b4f5a">composants</text><line x1="579" y1="118.0" x2="684" y2="118.0" stroke="#7C4DEB" stroke-width="2.4" marker-end="url(#av)"/><text x="631.5" y="89.0" font-size="14" text-anchor="middle" fill="#7C4DEB">caractéristiques</text><text x="631.5" y="106.0" font-size="14" text-anchor="middle" fill="#7C4DEB">dont le CO2</text><line x1="904" y1="118.0" x2="1009" y2="118.0" stroke="#17181c" stroke-width="2.4" marker-end="url(#ar)"/><text x="956.5" y="106.0" font-size="14" text-anchor="middle" fill="#4b4f5a">prix, fiches</text><line x1="1229" y1="118.0" x2="1334" y2="118.0" stroke="#17181c" stroke-width="2.4" marker-end="url(#ar)"/><text x="1281.5" y="89.0" font-size="14" text-anchor="middle" fill="#4b4f5a">achats</text><text x="1281.5" y="106.0" font-size="14" text-anchor="middle" fill="#4b4f5a">clients</text><rect x="740" y="270" width="210" height="96" rx="14" fill="#FDF7CF" stroke="#E3D36A" stroke-width="2"/><text x="845.0" y="314.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">ERP</text><text x="845.0" y="338.0" font-size="14" text-anchor="middle" fill="#4b4f5a">stocks, comptabilité</text><line x1="490.0" y1="170" x2="734" y2="318.0" stroke="#17181c" stroke-width="2.4" marker-end="url(#ar)"/><text x="620.0" y="205" font-size="14" text-anchor="middle" fill="#4b4f5a">nomenclature</text><line x1="1100.0" y1="170" x2="956" y2="318.0" stroke="#17181c" stroke-width="2.4" marker-end="url(#ar)"/><text x="1010.0" y="205" font-size="14" text-anchor="middle" fill="#4b4f5a">ventes</text><rect x="40" y="470" width="1510" height="96" rx="16" fill="#E6FCF9" stroke="#82F6EB" stroke-width="2"/><text x="795" y="514" font-size="20" font-weight="600" text-anchor="middle" fill="#17181c">Datalake</text><text x="795" y="540" font-size="14" text-anchor="middle" fill="#4b4f5a">une copie de chaque application, pour l’analyse</text><line x1="145.0" y1="170" x2="145.0" y2="464" stroke="#9DE3DC" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/><line x1="470.0" y1="170" x2="470.0" y2="464" stroke="#9DE3DC" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/><line x1="1120.0" y1="170" x2="1120.0" y2="464" stroke="#9DE3DC" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/><line x1="1445.0" y1="170" x2="1445.0" y2="464" stroke="#9DE3DC" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/><line x1="845.0" y1="370" x2="845.0" y2="464" stroke="#9DE3DC" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/><line x1="712" y1="170" x2="712" y2="464" stroke="#9DE3DC" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/><text x="1433.0" y="452" text-anchor="end" font-size="13" fill="#8a8f9c">copie chaque nuit</text><text x="40" y="610" font-size="14" fill="#7C4DEB" font-weight="600">— le chemin de l’impact CO2</text><text x="330" y="610" font-size="14" fill="#8a8f9c">- - - copie vers le datalake</text></svg>