<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Lignage de l'indicateur Product CO2 impact, produit par l'équipe data du domaine Produit : l'impact CO2 saisi dans le PLM est copié chaque nuit dans le datalake, nettoyé et converti en kg CO2e dans la table co2_par_produit, puis calculé en indicateur, utilisé par le tableau de bord RSE et par la fiche produit en magasin."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#17181c"/></marker><marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C4DEB"/></marker></defs><rect width="1500" height="560" fill="#fff"/><text x="40" y="60" font-size="14" font-weight="600" letter-spacing="2.2" fill="#8a8f9c">SOURCE</text><text x="150" y="128" font-size="14" text-anchor="middle" fill="#4b4f5a">saisie par le designer</text><path d="M370 136 V118 H1250 V136" fill="none" stroke="#7C4DEB" stroke-width="2"/><rect x="560" y="104" width="500" height="26" fill="#fff"/><text x="810" y="122" font-size="15" font-weight="600" text-anchor="middle" fill="#7C4DEB">produit par l’équipe data du domaine Produit</text><text x="1320" y="60" font-size="14" font-weight="600" letter-spacing="2.2" fill="#8a8f9c">USAGES</text><rect x="40" y="150" width="220" height="110" rx="14" fill="#FDF7CF" stroke="#E3D36A" stroke-width="2"/><text x="150.0" y="201.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">PLM</text><text x="150.0" y="225.0" font-size="14" text-anchor="middle" fill="#4b4f5a">conception produit</text><rect x="370" y="150" width="220" height="110" rx="14" fill="#E6FCF9" stroke="#82F6EB" stroke-width="2"/><text x="480.0" y="201.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">Datalake</text><text x="480.0" y="225.0" font-size="14" text-anchor="middle" fill="#4b4f5a">copie brute</text><rect x="700" y="150" width="220" height="110" rx="14" fill="#E6FCF9" stroke="#82F6EB" stroke-width="2"/><text x="810.0" y="201.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">Table nettoyée</text><text x="810.0" y="225.0" font-size="14" text-anchor="middle" fill="#4b4f5a">co2_par_produit</text><rect x="1030" y="150" width="220" height="110" rx="14" fill="#F1EAFD" stroke="#7C4DEB" stroke-width="3"/><text x="1140.0" y="201.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">Indicateur</text><text x="1140.0" y="225.0" font-size="14" text-anchor="middle" fill="#4b4f5a">Product CO2 impact</text><line x1="264" y1="205.0" x2="364" y2="205.0" stroke="#17181c" stroke-width="2.4" marker-end="url(#ar)"/><text x="314.0" y="174.0" font-size="14" text-anchor="middle" fill="#4b4f5a">copie</text><text x="314.0" y="191.0" font-size="14" text-anchor="middle" fill="#4b4f5a">chaque nuit</text><line x1="594" y1="205.0" x2="694" y2="205.0" stroke="#17181c" stroke-width="2.4" marker-end="url(#ar)"/><text x="644.0" y="174.0" font-size="14" text-anchor="middle" fill="#4b4f5a">nettoyage,</text><text x="644.0" y="191.0" font-size="14" text-anchor="middle" fill="#4b4f5a">en kg CO2e</text><line x1="924" y1="205.0" x2="1024" y2="205.0" stroke="#17181c" stroke-width="2.4" marker-end="url(#ar)"/><text x="974.0" y="191.0" font-size="14" text-anchor="middle" fill="#4b4f5a">calcul</text><rect x="1320" y="80" width="160" height="90" rx="14" fill="#FCEAFC" stroke="#E056E6" stroke-width="2"/><text x="1400.0" y="132.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">Tableau RSE</text><rect x="1320" y="240" width="160" height="90" rx="14" fill="#FCEAFC" stroke="#E056E6" stroke-width="2"/><text x="1400.0" y="292.0" font-size="19" font-weight="600" text-anchor="middle" fill="#17181c">Fiche magasin</text><path d="M1254 205.0 H1285 V125 H1314" fill="none" stroke="#17181c" stroke-width="2.4" marker-end="url(#ar)"/><path d="M1285 205.0 V285 H1314" fill="none" stroke="#17181c" stroke-width="2.4" marker-end="url(#ar)"/><rect x="40" y="380" width="1440" height="140" rx="16" fill="#fff" stroke="#7C4DEB" stroke-width="2" stroke-dasharray="7 6"/><text x="70" y="428" font-size="15" font-weight="600" letter-spacing="2" fill="#7C4DEB">ET SI LA SOURCE CHANGE ?</text><text x="70" y="464" font-size="19" fill="#17181c">Le PLM passe du kilo au gramme. En remontant le lignage, on sait qu’il faut adapter le nettoyage,</text><text x="70" y="492" font-size="19" fill="#17181c">et que deux usages sont touchés : le tableau RSE et la fiche magasin.</text></svg>